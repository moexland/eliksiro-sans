[project]
name = "eliksiro-sans"
version = "0.1.0"
description = "Eliksiro Sans build pipeline"
readme = "README.md"
authors = [
    { name = "Moonchime", email = "moonchime@moex.email" }
]
requires-python = ">=3.15"
dependencies = [
    "attrs==26.1.0",
    "fontmake==3.12.2",
    "fontmath==0.10.0",
    "fonttools==4.66.1",
    "glyphslib==6.15.0",
    "openstep-plist==0.5.2",
    "ufo2ft==3.9.1",
    "ufolib2==0.18.1",
]

[project.scripts]
eliksiro-sans = "eliksiro_sans.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.92",
]
